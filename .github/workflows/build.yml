name: Java CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      force-update:
        description: 'Force Flush Velocity Library Cache'
        required: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Setup JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'

      - name: Patch Gradle Repositories
        run:
          sed -ni '/https:\/\/maven.aliyun.com\/repository\/public/{h;n;/https:\/\/repo1.maven.org\/maven2/!{:a;N;/https:\/\/maven.aliyun.com\/repository\/public/!ba;x;H;n};x;H;x};p' repositories


      - name: Build Dev
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: current
          arguments: ShadowJar


      - name: Cleanup Gradle Cache
        run: |
          rm -f ~/.gradle/caches/modules-2/modules-2.lock
          rm -f ~/.gradle/caches/modules-2/gc.properties

      - name: Archive artifacts (Build)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Build
          path: |
             velocity/build/libs/MultiLogin-Velocity-*.jar

